<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 150" fill="none" role="img" aria-label="ASLY | أصلي TECH STORE">
  <defs>
    <linearGradient id="whiteGrad" x1="0" y1="15" x2="0" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4F2F2"/>
    </linearGradient>
    <linearGradient id="goldDarkGrad" x1="20" y1="110" x2="490" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C88D1E"/>
      <stop offset="45%" stop-color="#FFE082"/>
      <stop offset="78%" stop-color="#E5AD34"/>
      <stop offset="100%" stop-color="#C58B1C"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Geometric "A" -->
    <path d="M22 104 L68 24 H89 L115 104 H92 L76 49 L46 104 H22 Z" fill="url(#whiteGrad)"/>
    <!-- "S" -->
    <path d="M124 85 L143 81 C146 89 154 92 165 92 C176 92 182 88 182 82 C182 76 175 74 160 71 C140 67 128 60 128 45 C128 31 143 22 166 22 C188 22 202 30 206 43 L187 48 C184 40 177 37 166 37 C156 37 150 40 150 45 C150 50 156 53 171 56 C192 60 205 67 205 82 C205 97 190 106 165 106 C142 106 128 98 124 85 Z" fill="url(#whiteGrad)"/>
    <!-- "L" -->
    <path d="M222 24 H245 V86 H286 L282 104 H222 V24 Z" fill="url(#whiteGrad)"/>
    <!-- "Y" -->
    <path d="M276 24 H301 L321 57 L345 24 H370 L331 75 V104 H308 V75 L276 24 Z" fill="url(#whiteGrad)"/>

    <!-- Signature Golden Swoosh Arc -->
    <path d="M10 109 C34 76, 74 60, 126 70 C100 72, 54 83, 18 115 Z" fill="url(#goldDarkGrad)"/>
    <path d="M14 107 C42 73, 84 58, 134 69 C105 67, 60 79, 20 112 Z" fill="#FFF3C4" opacity="0.6"/>

