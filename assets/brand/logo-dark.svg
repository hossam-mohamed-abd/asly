    <!-- Arabic "أصلي" -->
    <text x="524" y="96" text-anchor="end" direction="rtl" font-family="'Cairo', 'Tajawal', system-ui, sans-serif" font-weight="900" font-size="78" fill="url(#whiteGrad)">اصلي</text>
    <!-- Golden Hamza -->
    <path d="M518 14 C510 14, 506 18, 506 23 C506 27, 510 29, 517 29 L504 34 L506 38 L525 31 L525 26 C517 26, 514 25, 514 22 C514 19, 517 18, 524 18 Z" fill="url(#goldDarkGrad)"/>
  </g>

  <!-- Spaced Gold Subtitle: TECH STORE -->
  <text x="196" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Cairo', sans-serif" font-weight="800" font-size="19" letter-spacing="9" fill="url(#goldDarkGrad)">TECH STORE</text>
</svg>
